# Markdown link checking
exclude_path = ["node_modules", "ideation", "build"]
exclude = [
  # repository is new; some links point at pages that do not exist yet
  "^https://github\\.com/khalid999devs/react-native-pose-detection",
]
accept = [200, 206, 429]
max_retries = 2
timeout = 20
max_concurrency = 8
