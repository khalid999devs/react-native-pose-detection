version: 2

# Routine npm version-update PRs are disabled (open-pull-requests-limit: 0). The
# github-actions ecosystem below is left on.
#
# Security updates are NOT affected. Dependabot still opens a PR for any
# advisory affecting this repository, because those come from the security
# alerts system rather than from this schedule.
#
# The whole toolchain was brought current in August 2026. Re-enable routine
# updates by raising the limit when the project has an actual release cadence
# and someone to triage the noise.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    ignore:
      # Pinned deliberately, see docs/adr/0007-pin-mediapipe-0-10-35.md
      - dependency-name: 'com.google.mediapipe:tasks-vision'
      - dependency-name: 'MediaPipeTasksVision'
      # typescript-eslint peers on typescript <6.1.0, so 7.x breaks linting
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Peer-satisfying devDependencies. These must match a combination that
      # has been tested on device; bumping them blind breaks the example app.
      - dependency-name: 'expo'
      - dependency-name: 'expo-module-scripts'
      - dependency-name: 'react'
      - dependency-name: 'react-native'

  # Actions stay on: they are pinned to commit SHAs, so an update PR is the only way a retagged
  # or yanked action ever reaches a reviewer.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
