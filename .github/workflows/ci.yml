name: CI

on:
  push:
    branches: [main]
  pull_request:

# `npm ci` executes third-party lifecycle scripts, so the token those scripts inherit is
# read-only. Nothing in these jobs writes back to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: 'Code: lint, format, types, tests, dead code'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the floor declared in engines, 24 is what .nvmrc pins for development. Both are
        # exercised so the floor is a tested promise rather than a guess.
        node: ['22.22.1', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run deadcode

  docs:
    name: 'Docs: markdown, spelling, links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:md
      - run: npm run spell
      # Third-party action, so it is pinned to a commit rather than to a tag its owner can move.
      #
      # The token is not for private links: with one, lychee resolves github.com URLs through the
      # API instead of fetching the pages, which is what stops the runner's `HTTP/2 protocol
      # error` against github.com from failing a build over links that are fine.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: '--config lychee.toml --no-progress "**/*.md"'
          token: ${{ secrets.GITHUB_TOKEN }}

  kotlin:
    name: 'Native: Kotlin lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ktlint
        env:
          KTLINT_VERSION: '1.8.0'
        run: |
          curl -sSLO "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/ktlint
      - run: ktlint 'packages/core/android/**/*.kt'

  # One macOS runner, billed at ten times the Linux rate, so the lint and the engine suite share
  # it. The detection job that used to gate this is gone: there is Swift on every branch now.
  swift:
    name: 'Native: Swift lint and engine tests'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install swiftlint
      - run: swiftlint lint --strict
      # No simulator, no Xcode project and no MediaPipe: this is the half of the iOS source that
      # has no platform in it, which is the same half JUnit covers on Android. Run directly rather
      # than through the npm script, so the macOS runner does not pay for an `npm ci` to reach it.
      - run: swift test --package-path packages/core/ios

  package:
    name: 'Package: exports, types, tarball'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.22.1', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Deliberately no `npm run build` first. Every step below packs the way `npm publish` does,
      # through the package's own prepack, so a publish path that forgets an artifact fails here.
      - run: npm run check:package
      - name: Assert the tarball has what consumers load
        run: |
          # expo-module-scripts prints a preamble before the JSON
          npm pack --dry-run --json -w react-native-pose-detection \
            | sed -n '/^\[/,$p' > /tmp/pack.json
          if grep -qE '\.(task|tflite|mlmodel)"' /tmp/pack.json; then
            echo "::error::A model file leaked into the tarball. See docs/adr/0002."
            exit 1
          fi
          node -e "
            const files = require('/tmp/pack.json')[0].files.map((file) => file.path);
            const required = [
              'build/index.js',
              'build/index.d.ts',
              'plugin/build/index.js',
              'plugin/build/cli.js',
              'cli/index.js',
              'app.plugin.js',
              'expo-module.config.json',
            ];
            const missing = required.filter((file) => !files.includes(file));
            if (missing.length > 0) {
              console.log('::error::Missing from the tarball: ' + missing.join(', '));
              process.exit(1);
            }
          "
          SIZE=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/pack.json'))[0].unpackedSize")
          echo "unpacked: $SIZE bytes"
          if [ "$SIZE" -gt 2000000 ]; then
            echo "::error::Tarball exceeds 2 MB: something leaked into files[]."
            exit 1
          fi
      - name: Smoke test the packed CLI
        run: |
          npm pack -w react-native-pose-detection --pack-destination /tmp
          mkdir -p /tmp/tarball
          tar -xzf /tmp/react-native-pose-detection-*.tgz -C /tmp/tarball
          node /tmp/tarball/package/cli/index.js --help

  security:
    name: 'Security: audit and licenses'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:deps
      - run: npm run audit:license
      - run: npm run audit:dev

  android-expo:
    name: 'Android: build the Expo example'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      # The example imports the package's build output, not its sources.
      - run: npm run build

      # The model is 9.4 MB from Google's CDN and its checksum is pinned, so a cache hit is
      # byte-identical to a download. A miss just downloads it.
      - name: Cache the pose model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/react-native-pose-detection
          key: pose-model-full-float16-1

      - name: Generate the native project
        working-directory: example/expo
        run: npx expo prebuild --platform android --clean --no-install

      - name: Assert the config plugin did its work
        working-directory: example/expo
        run: |
          test -f android/app/src/main/assets/pose_landmarker_full.task
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml

      - name: Build
        working-directory: example/expo/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assert the APK carries every ABI and exactly one model
        working-directory: example/expo
        run: |
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libmediapipe_tasks_jni.so" \
              || { echo "missing $abi"; exit 1; }
          done
          test "$(unzip -l "$apk" | grep -c '\.task$')" -eq 1

  android-bare:
    name: 'Android: build the bare example'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build

      - name: Cache the pose model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/react-native-pose-detection
          key: pose-model-full-float16-1

      # No prebuild here, and that is the point: the native projects are committed, so this is
      # the CLI installing into a project that already exists.
      - name: Install the model through the CLI
        working-directory: example/bare
        run: npx react-native-pose-detection fetch-model full

      - name: Doctor
        working-directory: example/bare
        run: npx react-native-pose-detection doctor

      # The committed pbxproj already carries the model reference. If the CLI writes anything
      # different, the two have drifted and one of them is wrong.
      - name: Assert the CLI left the Xcode project unchanged
        run: git diff --exit-code -- example/bare/ios

      # The library has no Gradle build of its own, so its JVM tests run through this app's.
      - name: Kotlin unit tests
        working-directory: example/bare/android
        run: ./gradlew :react-native-pose-detection:testDebugUnitTest --no-daemon

      - name: Build
        working-directory: example/bare/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assert the APK carries every ABI and exactly one model
        working-directory: example/bare
        run: |
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libmediapipe_tasks_jni.so" \
              || { echo "missing $abi"; exit 1; }
          done
          test "$(unzip -l "$apk" | grep -c '\.task$')" -eq 1

      # Autolinking is the whole reason this app exists: no config plugin ran, so if the module
      # is not on the app's classpath, nothing else here would have noticed.
      - name: Assert the module was autolinked
        working-directory: example/bare/android
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon \
            | grep -q 'project :react-native-pose-detection'

  ios-expo:
    name: 'iOS: build the Expo example'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # Expo SDK 57 does not compile on Xcode 26.3: `expo-modules-jsi` fails on an ambiguous `abs`
      # under C++ interop and `expo-modules-core` on a sending-risks-data-races error. Neither is
      # ours, and neither reproduces on the toolchain this image ships. Printed so that a future
      # image bump that reintroduces it is one line away from being diagnosed.
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Cache the pose model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/react-native-pose-detection
          key: pose-model-full-float16-1

      - name: Generate the native project
        working-directory: example/expo
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Assert the config plugin did its work
        working-directory: example/expo/ios
        run: |
          test -f PoseDetection/Resources/pose_landmarker_full.task
          grep -q 'NSCameraUsageDescription' PoseDetection/Info.plist
          # The resource has to be in the target as well as on disk, or it is not in the bundle.
          grep -q 'pose_landmarker_full.task' PoseDetection.xcodeproj/project.pbxproj

      - name: Pods
        working-directory: example/expo/ios
        run: pod install

      - name: Build
        working-directory: example/expo/ios
        shell: bash
        run: |
          xcodebuild build \
            -workspace PoseDetection.xcworkspace \
            -scheme PoseDetection \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

      - name: Assert the app bundle carries exactly one model
        working-directory: example/expo/ios
        run: |
          app=$(find build/Build/Products -maxdepth 2 -name '*.app' | head -1)
          test "$(find "$app" -name '*.task' | wc -l | tr -d ' ')" -eq 1

  ios-bare:
    name: 'iOS: build the bare example, release'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Toolchain
        run: |
          xcodebuild -version
          brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Cache the pose model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/react-native-pose-detection
          key: pose-model-full-float16-1

      # No prebuild: the Xcode project is committed, so this is the CLI writing into one that
      # already exists, which is the case the config plugin never sees.
      - name: Install the model through the CLI
        working-directory: example/bare
        run: npx react-native-pose-detection fetch-model full

      - name: Doctor
        working-directory: example/bare
        run: npx react-native-pose-detection doctor

      # Before `pod install`, which writes into the same directory. The committed pbxproj already
      # carries the model reference, so any difference means the CLI and the checked-in project
      # have drifted and one of them is wrong.
      - name: Assert the CLI left the Xcode project unchanged
        run: git diff --exit-code -- example/bare/ios

      - name: Pods
        working-directory: example/bare/ios
        run: pod install

      # The lock is committed, so a resolve that changes it means a transitive pod moved under a
      # constraint that was supposed to pin it.
      #
      # Two of its lines are environment rather than dependency and are filtered out: CocoaPods
      # stamps the version that wrote the file, and React Native generates `hermes-engine`'s
      # podspec during install, so its checksum differs between any two machines. Comparing those
      # would fail every time a runner image moved, which is noise rather than a pin escaping.
      - name: Assert Podfile.lock did not move
        shell: bash
        run: |
          strip() { grep -vE '^COCOAPODS: |^  hermes-engine: '; }
          git show HEAD:example/bare/ios/Podfile.lock | strip > "$RUNNER_TEMP/lock-committed"
          strip < example/bare/ios/Podfile.lock > "$RUNNER_TEMP/lock-resolved"
          diff -u "$RUNNER_TEMP/lock-committed" "$RUNNER_TEMP/lock-resolved" \
            || { echo "::error::A pod moved under a constraint that was supposed to pin it."; exit 1; }

      # Release rather than Debug, and this is the only cell that builds it. Release is where the
      # optimizer and the linker's dead-stripping run, and a Swift symbol reached only from the
      # Expo module registry is exactly what gets stripped when it is not reachable statically.
      - name: Build
        working-directory: example/bare/ios
        shell: bash
        run: |
          xcodebuild build \
            -workspace PoseExampleBare.xcworkspace \
            -scheme PoseExampleBare \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

      - name: Assert the module survived dead-stripping
        working-directory: example/bare/ios
        run: |
          app=$(find build/Build/Products -maxdepth 2 -name '*.app' | head -1)
          binary="$app/$(basename "$app" .app)"
          # Two ways of asking, because a release app target is stripped: nm sees the symbol when
          # it survived, and the mangled name is in Swift's type metadata either way.
          nm -gU "$binary" 2>/dev/null | grep -q 'PoseDetectionModule' \
            || strings -a "$binary" | grep -q 'PoseDetectionModule' \
            || { echo "::error::PoseDetectionModule is not in the release binary."; exit 1; }
          test "$(find "$app" -name '*.task' | wc -l | tr -d ' ')" -eq 1

      # Autolinking is the whole reason this app exists: no config plugin ran, so if the pod is
      # not in the workspace, nothing else here would have noticed.
      - name: Assert the pod was autolinked
        working-directory: example/bare/ios
        run: grep -q 'ReactNativePoseDetection' Podfile.lock

  commits:
    name: 'Commits: conventional format'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD --verbose

  # The matrix is four cells, not the eight this was reserved for: platform (ios, android) ×
  # install (expo, bare). The architecture axis collapsed on its own, because React Native 0.82
  # removed the legacy architecture and 0.86 is what both examples are on. `newArchEnabled=true`
  # survives in the bare app's gradle.properties as a leftover the template still writes.
